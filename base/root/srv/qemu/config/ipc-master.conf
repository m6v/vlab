-name $VM_NAME
-enable-kvm
-machine q35
-m 512
-smp 1
-cpu host
-rtc base=utc
-drive file=$HOME/.local/share/qemu/images/$VM_NAME.qcow2,format=qcow2,cache=writeback,if=none,id=disk0_backend
-device ahci,id=sata0
-device ide-hd,bus=sata0.0,drive=disk0_backend,id=disk0,bootindex=1
-netdev bridge,id=net0,br=br0
-device e1000,netdev=net0,mac=08:00:27:3e:be:f1
-netdev bridge,id=net1,br=br1
-device e1000,netdev=net1,mac=08:00:27:3e:be:f2
-vga virtio
-vnc 0.0.0.0:4,share=force-shared
-spice port=6904,addr=127.0.0.1,disable-ticketing=on
-device qemu-xhci,id=usb3
-device usb-tablet,bus=usb3.0
-monitor unix:/tmp/qemu/$USER/$VM_NAME.sock,server,nowait
-daemonize
