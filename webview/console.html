<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>${vm_name}</title>
    <link id="dynamic-favicon" rel="icon" type="image/png" href="/favicon.ico">
    <link rel="stylesheet" href="/novnc/app/styles/base.css">

    <style>
        #noVNC_container {
            width: 100%;
            height: 100%;
        }

        #offline-ui {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        #offline-ui.visible {
            display: flex;
        }

        #start_info {
            color: #fff;
            text-align: center;
            font-size: 20px;
            line-height: 1.4;
        }

        #start_button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 32px;
            font: inherit;
            font-size: 20px;
            color: #fff;
            background: #4c4c4c;
            border: 1px solid #2f2f2f;
            border-bottom-width: 2px;
            outline: 8px solid #4c4c4c;
            box-shadow: 6px 6px 0 8px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        #start_button:active {
            border-bottom-width: 1px;
            transform: translateY(1px);
        }

        #start_button:hover {
            background: #666;
        }

        #start_button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="noVNC_container"></div>

    <div id="offline-ui">
        <div id="start_info">Виртуальная машина ${vm_name} не запущена</div>
        <button id="start_button" type="button">
            <img alt="" src="/novnc/app/images/power.svg">
            <span>Запустить</span>
        </button>
    </div>

    <script type="module">
        import RFB from '/novnc/core/rfb.js';

        const VMConsole = {
            vmName: "${vm_name}",
            proxyPort: "${proxy_port}",
            rfb: null,
            pollTimer: null,
            isConnecting: false,

            init() {
                this.ui = document.getElementById('offline-ui');
                this.btn = document.getElementById('start_button');
                this.btnText = this.btn.querySelector('span');

                if (this.vmName) {
                    document.getElementById('dynamic-favicon').href =
                        `/favicon.ico?vm=${encodeURIComponent(this.vmName)}&v=${Date.now()}`;
                }

                this.btn.addEventListener('click', () => this.launchVM());
                window.addEventListener('pagehide', () => this.disconnect());

                this.checkStatus();
            },

            setOfflineState(isLaunching = false) {
                this.ui.classList.add('visible');
                this.btn.disabled = isLaunching;
                this.btnText.textContent = isLaunching ? 'Запуск...' : 'Запустить';
            },

            async isRunning() {
                try {
                    const res = await fetch(`/status?vm=${encodeURIComponent(this.vmName)}`, { cache: 'no-store' });
                    return res.ok && (await res.text()).trim() === 'RUNNING';
                } catch {
                    return false;
                }
            },

            async checkStatus(intervalMs = 2500) {
                this.stopPolling();
                if (await this.isRunning()) {
                    this.connectVNC();
                } else {
                    this.ui.classList.add('visible');
                    this.pollTimer = setTimeout(() => this.checkStatus(intervalMs), intervalMs);
                }
            },

            stopPolling() {
                clearTimeout(this.pollTimer);
                this.pollTimer = null;
            },

            disconnect() {
                this.stopPolling();
                try { this.rfb?.disconnect(); } catch {}
                this.rfb = null;
            },

            connectVNC() {
                if (this.isConnecting) return;
                this.isConnecting = true;
                this.disconnect();

                const container = document.getElementById('noVNC_container');
                container.textContent = '';

                const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${proto}//${location.hostname}:${this.proxyPort}/ws?token=${encodeURIComponent(this.vmName)}`;

                const client = new RFB(container, wsUrl, {
                    wsProtocols: ['binary'],
                    focusOnClick: true,
                    pingInterval: 10
                });
                client.scaleViewport = true;

                client.addEventListener('connect', () => {
                    this.isConnecting = false;
                    this.rfb = client;
                    this.ui.classList.remove('visible');
                    setTimeout(() => this.rfb?.focus(), 150);
                });

                client.addEventListener('disconnect', () => {
                    this.isConnecting = false;
                    this.rfb = null;
                    this.setOfflineState(false);
                    this.checkStatus(1500);
                });
            },

            async launchVM() {
                if (this.btn.disabled) return;
                this.setOfflineState(true);
                this.stopPolling();

                try {
                    const res = await fetch(`/start?vm=${encodeURIComponent(this.vmName)}`, { cache: 'no-store' });
                    this.checkStatus(res.ok ? 500 : 2500);
                } catch {
                    this.setOfflineState(false);
                    this.checkStatus(2500);
                }
            }
        };

        VMConsole.init();
    </script>
</body>
</html>
