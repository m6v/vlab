<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VNC Viewer</title>
    <!-- Оригинальные стили noVNC -->
    <link rel="stylesheet" href="/novnc/app/styles/base.css">

    <style>
        #noVNC_container {
            width: 100%;
            height: 100%;
        }
        #offline-ui {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10;
        }
        #pve_start_info {
            color: white;
            text-align: center;
            font-size: 20px;
            padding: 6px;
            line-height: 1.4;
        }
        #pve_start_sub {
            color: #cccccc;
            text-align: center;
            font-size: 14px;
            padding: 4px;
        }
    </style>
</head>
<body>

    <div id="noVNC_container"></div>

    <div id="offline-ui" class="noVNC_center">
        <div id="pve_start_dlg" class="noVNC_open">
            <div id="pve_start_info">Виртуальная машина <span id="vmTitle"></span><br>не запущена</div>
            <div id="pve_start_sub">Ожидание запуска...</div>
        </div>
    </div>

    <script type="module">
        import RFB from '/novnc/core/rfb.js';

        const container = document.getElementById('noVNC_container');
        const offlineUi = document.getElementById('offline-ui');
        const vmTitle = document.getElementById('vmTitle');
        const startInfo = document.getElementById('pve_start_info');
        const startSub = document.getElementById('pve_start_sub');

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const proxyPort = params.get('port') || '8080';

        let rfb = null;
        let pollTimer = null;

        function showOffline() {
            offlineUi.style.display = 'flex';
        }

        function showOnline() {
            offlineUi.style.display = 'none';
        }

        async function checkIsRunning() {
            try {
                const res = await fetch('/api/ping');
                if (!res.ok) return false;
                const states = await res.json();
                const suffix = `:${token}`;

                for (const key of Object.keys(states)) {
                    if (key.endsWith(suffix) && states[key] === true) {
                        return true;
                    }
                }
            } catch (e) {
                // Игнорируем временные сетевые сбои при опросе
            }
            return false;
        }

        function startPolling() {
            if (pollTimer) return;
            pollTimer = setInterval(async () => {
                if (await checkIsRunning()) {
                    stopPolling();
                    connectVNC();
                }
            }, 2500);
        }

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        function connectVNC() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.hostname}:${proxyPort}/ws?token=${encodeURIComponent(token)}`;

            rfb = new RFB(container, wsUrl, {
                wsProtocols: ['binary'],
                focusOnClick: true,
                pingInterval: 10
            });

            rfb.scaleViewport = true;

            rfb.addEventListener('connect', () => {
                stopPolling();
                showOnline();
                setTimeout(() => rfb.focus(), 150);
            });

            rfb.addEventListener('disconnect', () => {
                rfb = null;
                showOffline();
                startPolling();
            });
        }

        async function init() {
            if (!token) {
                startInfo.textContent = 'Не выбрана виртуальная машина';
                startSub.style.display = 'none';
                showOffline();
                return;
            }

            vmTitle.textContent = token;

            if (await checkIsRunning()) {
                connectVNC();
            } else {
                showOffline();
                startPolling();
            }
        }

        init();
    </script>
</body>
</html>
