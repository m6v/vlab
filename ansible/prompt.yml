---
- name: Опрос учетных данных SSH и SUDO
  hosts: all
  gather_facts: false
  vars_prompt:
    - name: input_user
      prompt: "Введите имя учетной записи администратора (administrator)"
      private: false

    - name: input_password
      prompt: "Введите пароль администратора или Enter для использования ключей"
      private: true

  tasks:
    - name: Сохранение настроек авторизации на время текущей сессии
      # Выполняем только один раз для каждого хоста
      set_fact:
        ansible_user: "{{ input_user | default('administrator', true) }}"
        ansible_password: "{{ input_password | default(omit, true) }}"
        ansible_become_password: "{{ input_password | default(omit, true) }}"