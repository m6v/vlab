---
- name: Поиск образов оверлейных дисков в пользовательском пуле
  find:
    paths: "{{ user_pool_path }}"
    patterns: "*.qcow2"
  register: user_images
  # Не падать с ошибкой, если каталог отсутствует
  failed_when: false

- name: Формирование списка имен доменов для удаления
  set_fact:
    # Извлечение имен доменов на основе файлов с образами дисков в пуле пользователя
    user_domains: "{{ user_images.files | default([]) | map(attribute='path') | map('basename') | map('regex_replace', '\\.qcow2$', '') | list }}"

- name: Принудительная остановка доменов пользователя (если запущены)
  command: "virsh destroy {{ item }}"
  loop: "{{ user_domains }}"
  failed_when: false

- name: Удаление конфигурации доменов пользователя
  command: "virsh undefine {{ item }} --nvram"
  loop: "{{ user_domains }}"
  failed_when: false

- name: Поиск ярлыков с маркером vlab на рабочем столе пользователя
  shell: "grep -l 'X-Related-To=vlab' {{ desktop_path }}/*.desktop 2>/dev/null"
  register: vlab_shortcuts
  failed_when: false
  changed_when: false

- name: Удаление ярлыков с маркером vlab
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ vlab_shortcuts.stdout_lines }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Удаление ярлыка для доступа к веб-панели
  file:
    path: "{{ desktop_path }}/web-panel.desktop"
    state: absent
  when: inventory_hostname == 'iws'
