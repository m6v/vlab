---
- name: Установка QEMU/KVM
  apt:
    name:
      - qemu-kvm
      - qemu-guest-agent
      - libvirt-daemon-system
      - virt-manager
    state: present
  # Скрыть скрыть вывод stdout
  no_log: true

- name: Остановка и отключение сети default
  shell: |
    virsh net-destroy default 2>/dev/null || true
    virsh net-undefine default 2>/dev/null || true
  changed_when: false

- name: Удаление конфигурационных файлов сети default
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/libvirt/qemu/networks/autostart/default.xml
    - /etc/libvirt/qemu/networks/default.xml

- name: Копирование XML-шаблонов во временный каталог
  copy:
    src: networks
    dest: /tmp/

- name: Регистрация, запуск и добавление сетей в автозагрузку
  # Заглушки || true подавляют ошибки при повторном запуске задачи
  shell: |
    virsh net-define "/tmp/networks/{{ item }}.xml"
    virsh net-start "{{ item }}" || true
    virsh net-autostart "{{ item }}" || true
  loop: "{{ virtual_networks }}"
  changed_when: true

- name: Добавление администратора в группы виртуализации
  user:
    name: "{{ ansible_user }}"
    groups:
      - kvm
      - libvirt
      - libvirt-admin
    append: yes

- name: Создание локального репозитория с дистрибутивами средств защиты
  synchronize:
    # Слэш на конце src задает копирование содержимого каталога, а не самого каталога
    src: files/distros/
    dest: "{{ local_repo_path }}/"
    recursive: yes
    delete: no
    archive: yes

- name: Копирование образов виртуальных машин в системный пул
  synchronize:
    # Слэш на конце src задает копирование содержимого каталога, а не самого каталога
    src: files/images/
    dest: "{{ system_pool_path }}/"
    recursive: yes
    delete: no
    archive: yes

- name: Настройка дефолтного пула хранения
  # sg (switch group) переключает группу на libvirt и запускает virsh,
  # так как в рамках текущего сеанса ssh администратор в ней не состоит
  shell:
    sg libvirt -c "virsh pool-define-as {{ system_pool_name }} dir --target {{ system_pool_path }} 2>/dev/null || true"
    sg libvirt -c "virsh pool-start {{ system_pool_name }} 2>/dev/null || true"
    sg libvirt -c "virsh pool-autostart {{ system_pool_name }} 2>/dev/null || true"
    sg libvirt -c "virsh pool-refresh {{ system_pool_name }} 2>/dev/null || true"
  changed_when: false

- name: Копирование иконок в системный каталог
  synchronize:
    # Слэш на конце src задает копирование содержимого каталога, а не самого каталога
    src: "{{ role_path }}/files/icons/"
    dest: "/usr/share/pixmaps/"
    recursive: yes
    delete: no
    archive: yes

- name: Копирование deb-пакетов с доп. программами на АРМ Инструктора
  synchronize:
    # Слэш на конце src задает копирование содержимого каталога, а не самого каталога
    src: "{{ role_path }}/files/packages/"
    dest: "/tmp/packages/"
    recursive: yes
    delete: no
    archive: yes
  when: inventory_hostname == 'iws'

- name: Установка deb-пакетов с доп. программами на АРМ Инструктора
  apt:
    deb: "{{ item }}"
  # fileglob ищет файлы на АРМ Инструктора
  with_fileglob:
    - "/tmp/packages/*.deb"
  become: true
  when: inventory_hostname == 'iws'
