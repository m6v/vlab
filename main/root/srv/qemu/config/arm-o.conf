-name "$VM_NAME"
-enable-kvm
-machine pc-q35-7.2
-m 2048
-smp 1
-cpu host
-rtc base=utc
-bios /usr/share/ovmf/OVMF.fd
-drive file=$HOME/.local/share/qemu/images/$VM_NAME.qcow2,format=qcow2,cache=writeback,if=none,id=disk0_backend
-device virtio-blk-pci,drive=disk0_backend,id=disk0,bootindex=1
-device ahci,id=sata-controller
-drive file=/srv/qemu/images/astra-1.7_x86-64.iso,media=cdrom,readonly=on,if=none,id=cd0_backend
-device ide-cd,bus=sata-controller.0,drive=cd0_backend,bootindex=2
-netdev bridge,id=net0,br=br1
-device virtio-net-pci,netdev=net0,mac=52:54:00:10:12:12
-vga virtio
-vnc 0.0.0.0:3
-device qemu-xhci,id=usb3
-device usb-tablet,bus=usb3.0
-monitor unix:/tmp/qemu/$USER/$VM_NAME.sock,server,nowait
-daemonize
