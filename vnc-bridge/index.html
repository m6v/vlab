<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{.VMName}}</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; background-color: #f5f7fa; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
        .card { background: #ffffff; padding: 40px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .btn-start { background: #2563eb; color: #ffffff; border: none; padding: 12px 32px; font-size: 15px; border-radius: 4px; cursor: pointer; }
        #vnc-container { width: 100%; height: 100%; background: #000000; display: none; }
        #offline-ui { display: none; }
    </style>
</head>
<body>
    <div id="vnc-container"></div>
    <div id="offline-ui" class="container"><div class="card"><h1>ВМ {{.VMName}} выключена</h1><button id="startBtn" class="btn-start" onclick="launchVM()">Включить</button></div></div>

    <script type="text/javascript">
        const currentVM = "{{.VMName}}";
        const proxyPort = "{{.ProxyPort}}";
        const moduleUrl = `http://${window.location.hostname}:${window.location.port}/novnc/core/rfb.js`;

        window.addEventListener('load', () => {
            fetch(`/status?vm=${encodeURIComponent(currentVM)}`).then(res => res.text()).then(status => {
                if (status.trim() === "RUNNING") {
                    document.getElementById('vnc-container').style.display = 'block';
                    initVNC();
                } else {
                    document.getElementById('offline-ui').style.display = 'flex';
                }
            });
        });

        function initVNC() {
            import(moduleUrl).then((mod) => {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.hostname}:${proxyPort}/ws?token=${encodeURIComponent(currentVM)}`;
                
                const container = document.getElementById('vnc-container');
                const rfb = new mod.default(container, wsUrl, { 
                    wsProtocols: ['binary'],
                    focusOnClick: true
                });
                
                rfb.scaleViewport = true;

                // АВТОФОКУС: Как только сессия успешно подключится, принудительно захватываем фокус ввода
                rfb.addEventListener('connect', () => {
                    setTimeout(() => {
                        rfb.focus();
                        console.log(`[VNC] Фокус ввода автоматически захвачен для ${currentVM}`);
                    }, 150);
                });

            });
        }

        function pollStatus() {
            fetch(`/status?vm=${encodeURIComponent(currentVM)}`).then(res => res.text()).then(status => {
                if (status.trim() === "RUNNING") {
                    document.getElementById('offline-ui').style.display = 'none';
                    document.getElementById('vnc-container').style.display = 'block';
                    initVNC();
                } else { setTimeout(pollStatus, 500); }
            });
        }

        function launchVM() {
            document.getElementById('startBtn').disabled = true;
            fetch(`/start?vm=${encodeURIComponent(currentVM)}`).then(res => { if (res.ok) pollStatus(); });
        }
    </script>
</body>
</html>
