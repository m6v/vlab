<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VM Control — {{.VMName}}</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; background-color: #1a1a1a; color: #fff; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
        .card { background: #2a2a2a; padding: 40px; border-radius: 12px; }
        h1 { margin-top: 0; font-size: 24px; }
        .status { margin: 20px 0; font-size: 16px; color: #aaa; }
        .status span.off { color: #ff4d4d; font-weight: bold; }
        .btn-start { background: #007bff; color: white; border: none; padding: 14px 28px; font-size: 16px; border-radius: 6px; cursor: pointer; }
        .btn-start:hover { background: #0056b3; }
        .btn-start:disabled { background: #555; cursor: not-allowed; }
        #vnc-screen { width: 100%; height: 100%; background: #000; display: block; }
    </style>
</head>
<body>

    {{if .IsRunning}}
        <div id="vnc-screen"></div>

        <script type="module">
            import RFB from '/novnc/core/rfb.js';

            // Автоматически определяем токен на основе имени текущей ВМ
            const vmName = "{{.VMName}}";
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            
            // Формируем стандартный websockify-совместимый URL с параметром token
            const wsUrl = `${protocol}//${window.location.host}/ws?token=${encodeURIComponent(vmName)}`;

            console.log("Connecting to dynamic VNC via WebSocket:", wsUrl);

            const rfb = new RFB(document.getElementById('vnc-screen'), wsUrl, {
                wsProtocols: ['binary']
            });

            rfb.scaleViewport = true;
            rfb.resizeSession = false;

            rfb.addEventListener('connect', () => { console.log("Successfully connected to VNC!"); });
            rfb.addEventListener('disconnect', (e) => { 
                console.log("VNC Disconnected, scheduling reconnect...");
                setTimeout(() => { window.location.reload(); }, 2000);
            });
        </script>
    {{else}}
        <div class="container">
            <div class="card">
                <h1>Виртуальная machine: {{.VMName}}</h1>
                <div class="status">Статус: <span class="off">Выключена</span></div>
                <button id="startBtn" class="btn-start" onclick="launchVM()">Включить питание</button>
            </div>
        </div>

        <script>
            function launchVM() {
                const btn = document.getElementById('startBtn');
                btn.disabled = true;
                btn.innerText = 'Запуск...';

                // Динамически передаем имя машины в эндпоинт запуска
                const vmName = "{{.VMName}}";
                fetch(`/start?vm=${encodeURIComponent(vmName)}`)
                    .then(res => {
                        if (res.ok) {
                            setTimeout(() => { window.location.reload(); }, 3000);
                        } else {
                            alert('Не удалось запустить ВМ');
                            btn.disabled = false;
                            btn.innerText = 'Включить питание';
                        }
                    })
                    .catch(err => {
                        alert('Ошибка сети: ' + err);
                        btn.disabled = false;
                        btn.innerText = 'Включить питание';
                    });
            }
        </script>
    {{end}}

</body>
</html>
