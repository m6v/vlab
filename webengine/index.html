<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{.VMName}}</title>
    <link id="dynamic-favicon" rel="icon" type="image/png" href="/favicon.ico">

    <!-- Оригинальные стили Proxmox и noVNC -->
    <link rel="stylesheet" href="/novnc/app/styles/base.css">
    <link rel="stylesheet" href="/novnc/app/styles/pve.css">

    <style>
        #noVNC_container {
            width: 100%;
            height: 100%;
        }
        #offline-ui {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10;
        }
        #pve_start_button.disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="noVNC_container"></div>

    <div id="offline-ui" class="noVNC_center">
        <div id="pve_start_dlg" class="noVNC_open">
            <div id="pve_start_info">Виртуальная машина {{.VMName}}<br>не запущена</div>
            <div id="pve_start_button" onclick="VLabConsole.launchVM()">
                <div><img alt="" src="/novnc/app/images/power.svg"><span id="startBtnText">Запустить</span></div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        const VLabConsole = {
            vmName: "{{.VMName}}",
            proxyPort: "{{.ProxyPort}}",
            moduleUrl: `http://${window.location.hostname}:${window.location.port}/novnc/core/rfb.js`,

            init() {
                this.setupFavicon();
                this.checkInitialStatus();
            },

            setupFavicon() {
                const favicon = document.getElementById('dynamic-favicon');
                if (favicon && this.vmName) {
                    const cacheBuster = new Date().getTime();
                    favicon.href = `/favicon.ico?vm=${encodeURIComponent(this.vmName)}&v=${cacheBuster}`;
                }
            },

            checkInitialStatus() {
                fetch(`/status?vm=${encodeURIComponent(this.vmName)}`)
                    .then(res => res.text())
                    .then(status => {
                        if (status.trim() === "RUNNING") {
                            this.showVNC();
                        } else {
                            document.getElementById('offline-ui').style.display = 'flex';
                        }
                    })
                    .catch(() => {
                        document.getElementById('offline-ui').style.display = 'flex';
                    });
            },

            showVNC() {
                document.getElementById('offline-ui').style.display = 'none';
                const container = document.getElementById('noVNC_container');
                container.style.display = 'block';
                this.connectVNC(container);
            },

            connectVNC(targetElement) {
                import(this.moduleUrl).then((mod) => {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = `${protocol}//${window.location.hostname}:${this.proxyPort}/ws?token=${encodeURIComponent(this.vmName)}`;

                    const rfb = new mod.default(targetElement, wsUrl, {
                        wsProtocols: ['binary'],
                        focusOnClick: true,
                        pingInterval: 10
                    });

                    rfb.scaleViewport = true;

                    rfb.addEventListener('connect', () => {
                        setTimeout(() => rfb.focus(), 150);
                    });
                }).catch(err => console.error("[VNC] Failed to load rfb.js:", err));
            },

            pollStatus() {
                fetch(`/status?vm=${encodeURIComponent(this.vmName)}`)
                    .then(res => res.text())
                    .then(status => {
                        if (status.trim() === "RUNNING") {
                            this.showVNC();
                        } else {
                            setTimeout(() => this.pollStatus(), 500);
                        }
                    });
            },

            launchVM() {
                const btn = document.getElementById('pve_start_button');
                const btnText = document.getElementById('startBtnText');
                if (btn.classList.contains('disabled')) return;

                btn.classList.add('disabled');
                btnText.innerText = 'Запуск...';
                fetch(`/start?vm=${encodeURIComponent(this.vmName)}`)
                    .then(res => { if (res.ok) this.pollStatus(); });
            }
        };

        window.addEventListener('DOMContentLoaded', () => VLabConsole.init());
    </script>
</body>
</html>
