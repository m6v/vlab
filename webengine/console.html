<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>${vm_name}</title>
    <link id="dynamic-favicon" rel="icon" type="image/png" href="/favicon.ico">
    <link rel="stylesheet" href="/novnc/app/styles/base.css">

    <style>
        #noVNC_container {
            width: 100%;
            height: 100%;
        }
        #offline-ui {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10;
        }
        #pve_start_button.disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        div:not(#noVNC_container) {
            border-radius: unset !important;
        }
        #pve_start_dlg {
            transition: 0.2s ease-in-out;
            transform: scale(0, 0);
            visibility: hidden;
            opacity: 0;
        }
        #pve_start_dlg.noVNC_open {
            transform: scale(1, 1);
            visibility: visible;
            opacity: 1;
        }
        #pve_start_info {
            color: white;
            text-align: center;
            font-size: 20px;
            padding: 6px;
            line-height: 1.4;
        }
        #pve_start_button {
            cursor: pointer;
            padding: 6px;
            color: white;
            background: #4c4c4c;
            text-align: center;
            font-size: 20px;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.5);
        }
        #pve_start_button div {
            margin: 2px;
            padding: 5px 30px;
            border: 1px solid #2f2f2f;
            border-bottom-width: 2px;
            background: #4c4c4c;
            vertical-align: middle;
        }
        #pve_start_button div:active {
            border-bottom-width: 1px;
            margin-top: 3px;
        }
        :root:not(.noVNC_touch) #pve_start_button div:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        #pve_start_button img {
            vertical-align: bottom;
            padding: 0 5px 2px 0;
        }
    </style>
</head>
<body>

    <div id="noVNC_container"></div>

    <div id="offline-ui" class="noVNC_center">
        <div id="pve_start_dlg" class="noVNC_open">
            <div id="pve_start_info">Виртуальная машина ${vm_name}<br>не запущена</div>
            <div id="pve_start_button" onclick="VMConsole.launchVM()">
                <div><img alt="" src="/novnc/app/images/power.svg"><span id="startBtnText">Запустить</span></div>
            </div>
        </div>
    </div>

    <script type="module">
        import RFB from '/novnc/core/rfb.js';

        const VMConsole = {
            vmName: "${vm_name}",
            proxyPort: "${proxy_port}",
            rfb: null,
            pollTimer: null,

            init() {
                this.setupFavicon();
                this.checkInitialStatus();
            },

            setupFavicon() {
                const favicon = document.getElementById('dynamic-favicon');
                if (favicon && this.vmName) {
                    favicon.href = `/favicon.ico?vm=${encodeURIComponent(this.vmName)}&v=${Date.now()}`;
                }
            },

            showOffline() {
                document.getElementById('offline-ui').style.display = 'flex';
                const btn = document.getElementById('pve_start_button');
                btn.classList.remove('disabled');
                document.getElementById('startBtnText').innerText = 'Запустить';
            },

            showOnline() {
                document.getElementById('offline-ui').style.display = 'none';
            },

            async isRunning() {
                try {
                    const res = await fetch(`/status?vm=${encodeURIComponent(this.vmName)}`);
                    return res.ok && (await res.text()).trim() === 'RUNNING';
                } catch {
                    return false;
                }
            },

            async checkInitialStatus() {
                if (await this.isRunning()) {
                    this.connectVNC();
                } else {
                    this.showOffline();
                    // Фоновый опрос на случай, если машину запустят извне
                    this.startPolling(2500);
                }
            },

            startPolling(intervalMs) {
                if (this.pollTimer) return;
                this.pollTimer = setInterval(async () => {
                    if (await this.isRunning()) {
                        this.stopPolling();
                        this.connectVNC();
                    }
                }, intervalMs);
            },

            stopPolling() {
                if (this.pollTimer) {
                    clearInterval(this.pollTimer);
                    this.pollTimer = null;
                }
            },

            connectVNC() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.hostname}:${this.proxyPort}/ws?token=${encodeURIComponent(this.vmName)}`;

                this.rfb = new RFB(document.getElementById('noVNC_container'), wsUrl, {
                    wsProtocols: ['binary'],
                    focusOnClick: true,
                    pingInterval: 10
                });

                this.rfb.scaleViewport = true;

                this.rfb.addEventListener('connect', () => {
                    this.stopPolling();
                    this.showOnline();
                    setTimeout(() => this.rfb && this.rfb.focus(), 150);
                });

                this.rfb.addEventListener('disconnect', () => {
                    this.rfb = null;
                    this.showOffline();
                    this.startPolling(1500);
                });
            },

            launchVM() {
                const btn = document.getElementById('pve_start_button');
                if (btn.classList.contains('disabled')) return;

                btn.classList.add('disabled');
                document.getElementById('startBtnText').innerText = 'Запуск...';
                
                // Ускоряем поллинг после нажатия кнопки
                this.stopPolling();

                fetch(`/start?vm=${encodeURIComponent(this.vmName)}`)
                    .then(res => {
                        if (res.ok) {
                            this.startPolling(500);
                        } else {
                            this.showOffline();
                            this.startPolling(2500);
                        }
                    })
                    .catch(() => {
                        this.showOffline();
                        this.startPolling(2500);
                    });
            }
        };

        window.VMConsole = VMConsole;
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => VMConsole.init());
        } else {
            VMConsole.init();
        }
    </script>
</body>
</html>
