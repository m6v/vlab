<!doctype html>
<html>
<head>
    <title>Консоль ВМ</title>
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <style>
        html, body {
            margin: 0 !important; padding: 0 !important;
            width: 100% !important; height: 100% !important;
            background-color: #111 !important; overflow: hidden !important;
            font-family: sans-serif;
        }
        #spice-area {
            width: 100vw !important; height: 100vh !important;
            margin: 0 !important; padding: 0 !important; overflow: hidden !important;
            display: flex !important; justify-content: center !important; align-items: center !important;
            position: relative !important;
        }
        #spice-screen {
            width: 100% !important; height: 100% !important;
            display: flex !important; justify-content: center !important; align-items: center !important;
            margin: 0 !important; padding: 0 !important;
        }
        /* ЖЕСТКОЕ РАСПРАВЛЕНИЕ: Картинка занимает ровно 100% видимого окна */
        #spice-screen canvas {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: fill !important; /* Убираем черные поля, ломавшие геометрию */
            margin: 0 !important; padding: 0 !important;
            position: absolute !important; top: 0 !important; left: 0 !important;
            cursor: default !important;
        }
        iframe {
            width: 100%; height: 100%; border: none; background: #111;
            position: absolute; top: 0; left: 0; z-index: 99999; display: none;
        }
        .error-panel {
            position: absolute !important; top: 50% !important; left: 50% !important;
            transform: translate(-50%, -50%) !important; text-align: center; 
            background: #1e1e1e; padding: 40px 50px; border-radius: 12px; 
            border: 1px solid #7a1a1a; box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
            z-index: 999999; display: none; min-width: 320px;
        }
        .error-title { color: #ff4444; font-size: 22px; font-weight: 600; margin-bottom: 15px; }
        .error-text { color: #bbb; font-size: 14px; line-height: 1.5; }
    </style>

    <script type="module" crossorigin="anonymous">
        import * as SpiceHtml5 from './main.js';

        // ГЕОМЕТРИЧЕСКИЙ СИНХРОНИЗАТОР МЫШИ НА УРОВНЕ ПРОТОТИПА CANVAS
        (function() {
            var originalAddEventListener = HTMLCanvasElement.prototype.addEventListener;
            
            HTMLCanvasElement.prototype.addEventListener = function(type, listener, options) {
                var canvas = this;
                
                if ((type === 'mousemove' || type === 'mousedown' || type === 'mouseup') && typeof listener === 'function') {
                    var patchedListener = function(e) {
                        var rect = canvas.getBoundingClientRect();
                        if (rect.width > 0 && rect.height > 0) {
                            // Так как черных полей больше нет, пропорции окна Firefox 
                            // и пиксели Canvas соотносятся с абсолютной точностью
                            var scaleX = canvas.width / rect.width;
                            var scaleY = canvas.height / rect.height;

                            // Рассчитываем чистый внутренний оффсет мыши внутри Canvas (0,0 -> width,height)
                            var virtOffsetX = (e.clientX - rect.left) * scaleX;
                            var virtOffsetY = (e.clientY - rect.top) * scaleY;

                            // Восстанавливаем абсолютные клиентские координаты
                            var virtClientX = rect.left + virtOffsetX;
                            var virtClientY = rect.top + virtOffsetY;

                            // Перезаписываем абсолютно все координатные параметры для inputs.js RedHat
                            Object.defineProperty(e, 'offsetX', { get: function() { return virtOffsetX; } });
                            Object.defineProperty(e, 'offsetY', { get: function() { return virtOffsetY; } });
                            
                            Object.defineProperty(e, 'clientX', { get: function() { return virtClientX; } });
                            Object.defineProperty(e, 'clientY', { get: function() { return virtClientY; } });
                            
                            Object.defineProperty(e, 'layerX', { get: function() { return virtOffsetX; } });
                            Object.defineProperty(e, 'layerY', { get: function() { return virtOffsetY; } });
                            
                            Object.defineProperty(e, 'pageX', { get: function() { return virtClientX; } });
                            Object.defineProperty(e, 'pageY', { get: function() { return virtClientY; } });
                        }
                        
                        return listener.call(this, e);
                    };
                    return originalAddEventListener.call(this, type, patchedListener, options);
                }
                return originalAddEventListener.call(this, type, listener, options);
            };
            console.log("SYSTEM: Координатная сетка мыши принудительно зафиксирована 1 в 1.");
        })();

        function connect() {
            var urlParams = new URLSearchParams(window.location.search);
            var token = urlParams.get('token') || '';
            var title = urlParams.get('title') || token || 'Виртуальная машина';
            var password = urlParams.get('password') || '';

            document.title = title;

            if (!token || token.trim() === "") {
                showCriticalError("Ошибка инициализации сессии", "В адресной строке URI не указан обязательный параметр ?token=имя_машины");
                return;
            }

            var host = window.location.hostname;
            var port = window.location.port || (window.location.protocol === 'https:' ? 443 : 80);
            var scheme = window.location.protocol === 'https:' ? "wss://" : "ws://";
            var uri = scheme + host + ":" + port + "/ws?token=" + token;

            try {
                var sc = new SpiceHtml5.SpiceMainConn({
                    uri: uri, 
                    screen_id: "spice-screen", 
                    password: password, 
                    cursor: "on", 
                    onerror: function(e) { 
                        console.log("SPICE Connection offline");
                        showLauncher();
                    }, 
                    onagent: function() {
                        var iframe = document.getElementById('launcher-frame');
                        if (iframe) iframe.style.display = "none";

                        window.addEventListener('resize', function() {
                            SpiceHtml5.handle_resize(sc);
                        });
                        SpiceHtml5.resize_helper(this);
                    }
                });

                window.addEventListener('dragover', function(e) { e.preventDefault(); });
                window.addEventListener('drop', function(e) {
                    e.preventDefault();
                    if (e.dataTransfer && e.dataTransfer.files.length > 0) {
                        for (var i = 0; i < e.dataTransfer.files.length; i++) {
                            if (sc && typeof sc.send_file === 'function') {
                                sc.send_file(e.dataTransfer.files[i]);
                            }
                        }
                    }
                });
            } catch (e) {
                showLauncher();
            }
        }

        function showCriticalError(errTitle, errText) {
            document.getElementById('err-title').innerText = errTitle;
            document.getElementById('err-text').innerText = errText;
            document.getElementById('error-overlay').style.display = 'block';
        }

        function showLauncher() {
            var iframe = document.getElementById('launcher-frame');
            if (iframe && iframe.style.display !== "block") {
                var search = window.location.search;
                if (!search.includes("title=")) {
                    search += (search ? "&" : "?") + "title=" + encodeURIComponent(document.title);
                }
                iframe.src = "/launcher.html" + search;
                iframe.style.display = "block";
            }
        }

        connect();
        setInterval(function() { window.dispatchEvent(new Event('resize')); }, 200);
    </script>
</head>
<body>
    <div id="spice-area">
        <div id="error-overlay" class="error-panel">
            <div id="err-title" class="error-title">Критическая ошибка</div>
            <div id="err-text" class="error-text">Параметры сессии повреждены или отсутствуют.</div>
        </div>

        <iframe id="launcher-frame"></iframe>
        <div id="spice-screen" class="spice-screen"></div>
    </div>
</body>
</html>
