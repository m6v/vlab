-name $VM_NAME
-m 4096
-smp 2
-enable-kvm
-cpu host
-machine q35
-rtc base=localtime,clock=host
-vga virtio
-vnc 0.0.0.0:4,websocket=6904
-device qemu-xhci,id=usb3
-device usb-tablet,bus=usb3.0
-device usb-kbd,bus=usb3.0
-bios /usr/share/ovmf/OVMF.fd
-drive file=$HOME/.local/share/qemu/$VM_NAME.qcow2,format=qcow2,cache=writeback,if=none,id=disk0_backend
-device virtio-blk-pci,drive=disk0_backend,id=disk0,bootindex=1
-device ahci,id=sata-controller
-drive media=cdrom,readonly=on,id=cd0,if=none
-device ide-cd,bus=sata-controller.0,drive=cd0,bootindex=2
-netdev user,id=net0
-device virtio-net-pci,netdev=net0,mac=52:54:00:12:34:56
-monitor unix:/tmp/$VM_NAME.sock,server,nowait
-daemonize
