-name "$VM_NAME"
-enable-kvm
-machine q35
-m 1048
-smp 1
-cpu host
-rtc base=utc
-drive file=$HOME/.local/share/qemu/$VM_NAME.qcow2,format=qcow2,cache=writeback,if=none,id=disk0_backend
-device virtio-blk-pci,drive=disk0_backend,id=disk0,bootindex=1
-netdev bridge,id=net0,br=br0
-device e1000,netdev=net0,mac=08:00:27:3e:be:a1
-netdev bridge,id=net1,br=br0
-device e1000,netdev=net1,mac=08:00:27:3e:be:a2
-netdev bridge,id=net2,br=br0
-device e1000,netdev=net2,mac=08:00:27:3e:be:a3
-netdev bridge,id=net3,br=br1
-device e1000,netdev=net3,mac=08:00:27:3e:be:a4
-vga virtio
-vnc 0.0.0.0:11
-device qemu-xhci,id=usb3
-device usb-tablet,bus=usb3.0
-monitor unix:/tmp/$VM_NAME.sock,server,nowait
-daemonize
