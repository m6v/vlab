<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Включение ВМ</title>
    <link rel="icon" href="data:,">
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #111; display: flex; justify-content: center; 
            align-items: center; font-family: sans-serif; 
        }
        .panel { 
            text-align: center; background: #1e1e1e; padding: 50px 60px; 
            border-radius: 12px; border: 1px solid #333; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
        }
        .status-message { color: #fff; font-size: 22px; font-weight: 500; margin-bottom: 30px; }
        .btn { 
            background: #238636; color: white; border: none; 
            padding: 14px 32px; font-size: 16px; font-weight: 600; 
            border-radius: 6px; cursor: pointer; 
        }
        .btn:hover { background: #2ea043; }
        .spinner { 
            display: none; width: 40px; height: 40px; 
            border: 4px solid #333; border-top: 4px solid #2ea043; 
            border-radius: 50%; margin: 20px auto 0; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="panel">
        <div id="txt" class="status-message">Загрузка...</div>
        <button class="btn" id="btn" onclick="startVM()">Включить</button>
        <div id="loader" class="spinner"></div>
    </div>

    <script>
        var urlParams = new URLSearchParams(window.location.search);
        var token = urlParams.get('token') || 'vm';
        var title = urlParams.get('title') || token;
        
        document.title = title;
        document.getElementById('txt').innerText = "Виртуальная машина " + title + " выключена";

        function startVM() {
            document.getElementById('btn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('txt').innerText = 'Отправка команды на запуск QEMU...';
            
            fetch('/start?vm=' + token)
                .then(() => {
                    document.getElementById('txt').innerText = 'Запуск инициирован. Ожидание загрузки видеокарты...';
                    pollSocket();
                })
                .catch(err => {
                    document.getElementById('txt').innerText = 'Ошибка связи со шлюзом.';
                    document.getElementById('btn').style.display = 'inline-block';
                    document.getElementById('loader').style.display = 'none';
                });
        }

        function pollSocket() {
            var host = window.location.hostname;
            var port = window.location.port || (window.location.protocol === 'https:' ? 443 : 80);
            var scheme = window.location.protocol === 'https:' ? "wss://" : "ws://";
            var uri = scheme + host + ":" + port + "/ws?token=" + token;

            var pingInterval = setInterval(function() {
                var wsCheck = new WebSocket(uri);
                
                wsCheck.onopen = function() {
                    clearInterval(pingInterval);
                    wsCheck.close();
                    window.parent.location.reload();
                };

                wsCheck.onerror = function() {
                    wsCheck.close();
                };
            }, 1500); 
        }
    </script>
</body>
</html>
