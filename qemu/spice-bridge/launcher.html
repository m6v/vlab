<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{.Title}}</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #111; display: flex; justify-content: center; 
            align-items: center; font-family: sans-serif; 
        }
        .panel { 
            text-align: center; background: #1e1e1e; padding: 40px 60px; 
            border-radius: 12px; border: 1px solid #333; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
        }
        h1 { color: #fff; font-size: 24px; margin-bottom: 10px; font-weight: 500; }
        p { color: #888; font-size: 14px; margin-bottom: 25px; }
        .btn { 
            background: #238636; color: white; border: none; 
            padding: 14px 32px; font-size: 16px; font-weight: 600; 
            border-radius: 6px; cursor: pointer; 
        }
        .btn:hover { background: #2ea043; }
        .spinner { 
            display: none; width: 40px; height: 40px; 
            border: 4px solid #333; border-top: 4px solid #2ea043; 
            border-radius: 50%; margin: 20px auto 0; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="panel">
        <h1>{{.Title}}</h1>
        <p id="txt">Консоль отключена. Машина находится в выключенном состоянии.</p>
        <button class="btn" id="btn" onclick="startVM()">Включить ВМ</button>
        <div id="loader" class="spinner"></div>
    </div>

    <script>
        function startVM() {
            document.getElementById('btn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('txt').innerText = 'Отправка команды на запуск QEMU и ожидание загрузки...';
            
            fetch('/start?vm={{.Token}}')
                .then(() => {
                    setInterval(() => window.location.reload(), 2000);
                });
        }
    </script>
</body>
</html>
